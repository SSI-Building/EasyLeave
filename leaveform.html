<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฟอร์มลาออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Light Theme Default */
        :root {
            --primary-color-start: #1994b6;
            --primary-color-end: #36a761;
            --text-color-dark: #333;
            --text-color-light: #666;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --shadow-light: 0 4px 15px rgba(0,0,0,0.08);
            --border-color: #e0e0e0;
            --focus-ring-color: rgba(74, 144, 226, 0.2);
        }

        /* Dark Theme */
        body.theme-dark {
            --primary-color-start: #141E30;
            --primary-color-end: #243B55;
            --text-color-dark: #fff;
            --text-color-light: #bbb;
            --background-color: #181818;
            --card-background: #242424;
            --border-color: #444;
            --shadow-light: 0 4px 15px rgba(255,255,255,0.08);
            --focus-ring-color: rgba(36, 59, 85, 0.2);
        }
        
        /* General Theme Variants */
        body.theme-orange-purple { --primary-color-start: #ff7e5f; --primary-color-end: #6a11cb; }
        body.theme-blue-violet { --primary-color-start: #36d1dc; --primary-color-end: #5b86e5; }
        body.theme-pink-purple { --primary-color-start: #ff758c; --primary-color-end: #8e44ad; }
        body.theme-green-gold { --primary-color-start: #11998e; --primary-color-end: #fbc531; }
        body.theme-red-orange { --primary-color-start: #f12711; --primary-color-end: #f5af19; }
        body.theme-teal-navy { --primary-color-start: #2b5876; --primary-color-end: #4e4376; }
        body.theme-monochrome { --primary-color-start: #555; --primary-color-end: #999; }

        /* ===== Base Styles ===== */
        body {
            font-family: 'Prompt', sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-background);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow-light);
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 1.8em;
            position: relative;
            background: linear-gradient(90deg, var(--primary-color-start), var(--primary-color-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 i { -webkit-text-fill-color: var(--primary-color-end); }
        body.theme-dark h2 { -webkit-text-fill-color: var(--text-color-dark); background: none; }
        body.theme-dark h2 i { color: var(--primary-color-end); }

        .form-section {
            background: var(--background-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .form-section-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-color-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-section-title i { color: var(--primary-color-end); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .date-time-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .date-time-group .form-group { flex: 1; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-color-light);
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--card-background);
            color: var(--text-color-dark);
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color-end);
            box-shadow: 0 0 0 3px var(--focus-ring-color);
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .date-group {
            position: relative;
            padding-bottom: 25px;
        }
        .date-group .form-group { margin-bottom: 15px; }

        #leaveDaysDisplay {
            position: absolute;
            bottom: 0;
            left: 0;
            font-weight: 500;
            font-size: 12px;
            color: var(--text-color-light);
        }

        .signature-pad-container { position: relative; }
        .signature-pad {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            height: 150px;
            touch-action: none;
            background: var(--background-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn-clear {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            margin-top: 0;
            padding: 6px 10px;
            font-size: 11px;
            background: var(--card-background);
            color: var(--text-color-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-clear:hover { background: var(--background-color); }

        .buttons {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            background: linear-gradient(45deg, var(--primary-color-start), var(--primary-color-end));
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .btn-secondary {
            background: #B0B9C2;
            box-shadow: none;
        }
        
        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }
        .radio-group label {
            margin-bottom: 0;
            font-weight: 400;
            font-size: 13px;
            color: var(--text-color-dark);
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            margin-right: 3px;
            width: auto;
        }

        /* ===== สไตล์สำหรับส่วนแนบไฟล์และสแกนเอกสาร AI ===== */
        #documentUploadSection {
            display: none;
            margin-top: 12px;
            padding: 15px;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            background: var(--card-background);
        }
        .doc-action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-doc-action {
            flex: 1;
            min-width: 140px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border-color);
            background: var(--background-color);
            color: var(--text-color-dark);
            transition: all 0.25s ease;
        }
        .btn-doc-action:hover {
            border-color: var(--primary-color-start);
            background: rgba(25, 148, 182, 0.08);
        }
        .btn-doc-action.btn-camera-ai {
            background: linear-gradient(45deg, #1994b6, #36a761);
            color: #fff;
            border: none;
        }
        .btn-doc-action.btn-camera-ai:hover {
            opacity: 0.92;
            transform: translateY(-2px);
        }

        #docPreview {
            max-width: 100%;
            max-height: 220px;
            margin-top: 12px;
            border-radius: 8px;
            display: none;
            object-fit: contain;
            border: 1px solid var(--border-color);
        }

        /* แถบแจ้งสถานะ AI ตรวจสอบเอกสาร */
        .ai-doc-badge {
            display: none;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            align-items: center;
            gap: 8px;
        }
        .ai-doc-badge.scanning {
            display: flex;
            background: #e8f4fd;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .ai-doc-badge.valid {
            display: flex;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .ai-doc-badge.warning {
            display: flex;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* ===== Modal กล้อง AI Scanner ===== */
        .camera-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .camera-modal.active {
            display: flex;
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #cameraVideo {
            width: 100%;
            height: auto;
            display: block;
        }
        /* กรอบเล็งเอกสาร AI */
        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
            box-sizing: border-box;
        }
        .scanner-frame {
            flex: 1;
            margin: 15px 10px;
            border: 3px dashed rgba(255, 193, 7, 0.85);
            border-radius: 12px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }
        .scanner-frame.detected {
            border-color: #2ecc71;
            border-style: solid;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }
        .scanner-status {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            text-align: center;
            align-self: center;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .camera-controls {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
            max-width: 480px;
        }
        .btn-capture {
            flex: 2;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #2ecc71;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-close-cam {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #e74c3c;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        
        @media(min-width: 480px) {
            .buttons { flex-direction: row; }
        }

        /* ===== Loading Screen Styles ===== */
        .loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            flex-direction: column;
            gap: 20px;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--primary-color-end);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            color: var(--text-color-light);
            font-size: 1.2em;
            font-weight: 500;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Modal กล้องสแกนเอกสาร AI -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-box">
            <video id="cameraVideo" autoplay playsinline></video>
            <div class="scanner-overlay">
                <div class="scanner-status" id="scannerStatusText">
                    <i class="fas fa-robot"></i> AI กำลังค้นหาขอบเขตเอกสาร...
                </div>
                <div class="scanner-frame" id="scannerFrame"></div>
                <div class="scanner-status" style="font-size: 11.5px; opacity: 0.9;">
                    วางใบรับรองแพทย์หรือเอกสารให้อยู่ในกรอบ
                </div>
            </div>
        </div>
        <div class="camera-controls">
            <button type="button" class="btn-capture" id="captureBtn">
                <i class="fas fa-camera"></i> ถ่ายภาพเอกสาร
            </button>
            <button type="button" class="btn-close-cam" id="closeCameraBtn">
                <i class="fas fa-times"></i> ปิดกล้อง
            </button>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <h2>ฟอร์มลาออนไลน์ <i class="fas fa-file-contract"></i></h2>

        <section class="form-section">
            <h3 class="form-section-title"><i class="fas fa-user-circle"></i> ข้อมูลพนักงาน</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="empName">ชื่อ-สกุล</label>
                    <input type="text" id="empName" readonly value="ชื่อจริง นามสกุล">
                </div>
                <div class="form-group">
                    <label for="empId">รหัสพนักงาน</label>
                    <input type="text" id="empId" readonly value="EMP001">
                </div>
                <div class="form-group">
                    <label for="position">ตำแหน่ง</label>
                    <input type="text" id="position" readonly value="พนักงานทั่วไป">
                </div>
                <div class="form-group">
                    <label for="department">ฝ่าย</label>
                    <input type="text" id="department" readonly value="BUS">
                </div>
            </div>
        </section>

        <section class="form-section">
            <h3 class="form-section-title"><i class="fas fa-file-alt"></i> รายละเอียดการลา</h3>
            <div class="form-group">
                <label for="leaveType">ประเภทการลา</label>
                <select id="leaveType">
                    <option value="AL">ลาพักร้อน</option>
                    <option value="SL">ลาป่วย</option>
                    <option value="BL">ลากิจ</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="reason">เหตุผลการลา</label>
                <textarea id="reason" placeholder="กรุณากรอกเหตุผล"></textarea>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>เอกสารประกอบ</label>
                <div class="radio-group">
                    <label><input type="radio" name="hasDocument" value="มี"> มี</label>
                    <label><input type="radio" name="hasDocument" value="ไม่มี"> ไม่มี</label>
                </div>

                <!-- ส่วนอัปโหลดหรือถ่ายภาพเอกสารประกอบพร้อม AI -->
                <div id="documentUploadSection">
                    <label><i class="fas fa-paperclip"></i> แนบเอกสารประกอบ (เลือกรูป หรือ ถ่ายภาพสแกนด้วย AI) <span style="color:red;">*</span></label>
                    
                    <!-- ซ่อน input file เดิมแล้วใช้ปุ่มกดเรียกแทน -->
                    <input type="file" id="documentFile" accept="image/*" style="display: none;">
                    
                    <div class="doc-action-buttons">
                        <button type="button" class="btn-doc-action" id="btnChooseFile">
                            <i class="fas fa-folder-open"></i> เลือกรูปจากเครื่อง
                        </button>
                        <button type="button" class="btn-doc-action btn-camera-ai" id="btnOpenCamera">
                            <i class="fas fa-camera"></i> ถ่ายรูป / สแกนด้วย AI
                        </button>
                    </div>

                    <!-- แถบแสดงผลการตรวจสอบด้วย AI -->
                    <div id="aiDocBadge" class="ai-doc-badge"></div>

                    <!-- ตัวอย่างรูปภาพ -->
                    <img id="docPreview" alt="ตัวอย่างเอกสารประกอบ">
                </div>
            </div>
        </section>

        <section class="form-section">
            <h3 class="form-section-title"><i class="fas fa-clock"></i> ระยะเวลาการลา</h3>
            <div class="date-group">
                <div class="form-group">
                    <label for="startDate">ตั้งแต่วันที่</label>
                    <div class="date-time-group">
                        <div class="form-group">
                            <input type="date" id="startDate">
                        </div>
                        <div class="form-group">
                            <input type="time" id="startTime">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="endDate">ถึงวันที่</label>
                    <div class="date-time-group">
                        <div class="form-group">
                            <input type="date" id="endDate">
                        </div>
                        <div class="form-group">
                            <input type="time" id="endTime">
                        </div>
                    </div>
                </div>
                <div id="leaveDaysDisplay"></div>
            </div>
        </section>
        
        <section class="form-section">
            <h3 class="form-section-title"><i class="fas fa-signature"></i> ลายเซ็นอิเล็กทรอนิกส์</h3>
            <div class="form-group signature-pad-container">
                <canvas id="signaturePad" class="signature-pad"></canvas>
                <button type="button" id="clearBtn" class="btn-clear"><i class="fas fa-eraser"></i> ล้าง</button>
            </div>
        </section>

        <div class="buttons">
            <button class="btn" id="submitBtn"><i class="fas fa-paper-plane"></i> ส่งคำขอ</button>
            <button class="btn btn-secondary" onclick="window.location.href='Dashboard.html'"><i class="fas fa-arrow-left"></i> ย้อนกลับ</button>
        </div>
    </div>

    <!-- Libraries: SignaturePad & Tesseract.js (AI OCR สำหรับตรวจจับข้อความบนเอกสาร) -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const loadingScreen = document.getElementById('loadingScreen');
    const mainContainer = document.getElementById('mainContainer');

    // โหลดธีมจาก localStorage
    const savedTheme = localStorage.getItem('selectedTheme');
    if (savedTheme) {
        document.body.className = savedTheme;
        if (savedTheme === 'theme-custom') {
            const savedColorStart = localStorage.getItem('customColorStart');
            const savedColorEnd = localStorage.getItem('customColorEnd');
            if (savedColorStart && savedColorEnd) {
                document.body.style.setProperty('--primary-color-start', savedColorStart);
                document.body.style.setProperty('--primary-color-end', savedColorEnd);
            }
        }
    }

    setTimeout(() => {
        loadingScreen.classList.add('hidden');
        mainContainer.classList.add('loaded');
    }, 1000);

    // โหลดข้อมูลพนักงาน
    const set1 = JSON.parse(localStorage.getItem("leaveSet1"));
    if (!set1) {
        alert("ไม่พบข้อมูลพนักงาน กรุณากลับไปหน้า Dashboard");
        return;
    }
    document.getElementById("empId").value = set1[0];
    document.getElementById("empName").value = set1[1];
    document.getElementById("position").value = set1[2];
    document.getElementById("department").value = "BUS";

    // แสดงวันลาคงเหลือ
    const leaveTypeEl = document.getElementById("leaveType");
    const leaveBalanceInfo = document.createElement("div");
    leaveBalanceInfo.style.fontSize = "13px";
    leaveBalanceInfo.style.marginTop = "5px";
    leaveBalanceInfo.style.color = "var(--text-color-light)";
    leaveTypeEl.insertAdjacentElement("afterend", leaveBalanceInfo);

    function formatMinutes(totalMinutes) {
        const workDayMinutes = 8 * 60;
        const days = Math.floor(totalMinutes / workDayMinutes);
        const remainingMinutes = totalMinutes % workDayMinutes;
        const hours = Math.floor(remainingMinutes / 60);
        const minutes = remainingMinutes % 60;

        let result = "";
        if (days > 0) result += `${days} วัน `;
        if (hours > 0) result += `${hours} ชั่วโมง `;
        if (minutes > 0) result += `${minutes} นาที`;
        return result.trim();
    }

    function updateLeaveBalance() {
        let msg = "";
        switch (leaveTypeEl.value) {
            case "AL": msg = `วันลาพักร้อนคงเหลือ: ${formatMinutes(set1[3])}`; break;
            case "SL": msg = `วันลาป่วยคงเหลือ: ${formatMinutes(set1[4])}`; break;
            case "BL": msg = `วันลากิจคงเหลือ: ${formatMinutes(set1[5])}`; break;
        }
        leaveBalanceInfo.textContent = msg;
    }
    leaveTypeEl.addEventListener("change", updateLeaveBalance);
    updateLeaveBalance();

    // =========================================================================
    // 🤖 ระบบจัดการไฟล์เอกสารประกอบ + กล้องสแกนเอกสาร AI (Vision & OCR)
    // =========================================================================
    const docRadios = document.getElementsByName("hasDocument");
    const documentUploadSection = document.getElementById("documentUploadSection");
    const documentFileInput = document.getElementById("documentFile");
    const btnChooseFile = document.getElementById("btnChooseFile");
    const btnOpenCamera = document.getElementById("btnOpenCamera");
    const docPreview = document.getElementById("docPreview");
    const aiDocBadge = document.getElementById("aiDocBadge");

    // ตัวแปรสำหรับกล้อง
    const cameraModal = document.getElementById("cameraModal");
    const cameraVideo = document.getElementById("cameraVideo");
    const captureBtn = document.getElementById("captureBtn");
    const closeCameraBtn = document.getElementById("closeCameraBtn");
    const scannerFrame = document.getElementById("scannerFrame");
    const scannerStatusText = document.getElementById("scannerStatusText");

    let attachedDocumentBase64 = "";
    let cameraStream = null;
    let scanInterval = null;

    // เปิด-ปิดส่วนแนบเอกสารตาม Radio
    docRadios.forEach(radio => {
        radio.addEventListener("change", () => {
            if (radio.value === "มี" && radio.checked) {
                documentUploadSection.style.display = "block";
            } else if (radio.value === "ไม่มี" && radio.checked) {
                documentUploadSection.style.display = "none";
                documentFileInput.value = "";
                attachedDocumentBase64 = "";
                docPreview.style.display = "none";
                docPreview.src = "";
                aiDocBadge.className = "ai-doc-badge";
                aiDocBadge.innerHTML = "";
            }
        });
    });

    // ปุ่มที่ 1: เลือกไฟล์รูปจากเครื่อง
    btnChooseFile.addEventListener("click", () => {
        documentFileInput.click();
    });

    documentFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("กรุณาแนบเฉพาะไฟล์รูปภาพเท่านั้น (เช่น .jpg, .png)");
            documentFileInput.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            processAndVerifyDocumentImage(event.target.result);
        };
        reader.readAsDataURL(file);
    });

    // ปุ่มที่ 2: เปิดกล้องถ่ายรูปพร้อม AI ตรวจจับกรอบเอกสาร
    btnOpenCamera.addEventListener("click", async () => {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            cameraVideo.srcObject = cameraStream;
            cameraModal.classList.add("active");
            startRealtimeDocumentDetection();
        } catch (err) {
            alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้อง หรือใช้ปุ่มเลือกรูปจากเครื่องแทนครับ");
            console.error(err);
        }
    });

    // ฟังก์ชันปิดกล้อง
    function stopCamera() {
        if (scanInterval) clearInterval(scanInterval);
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        cameraModal.classList.remove("active");
    }

    closeCameraBtn.addEventListener("click", stopCamera);

    // AI วิเคราะห์ภาพจากกล้องแบบเรียลไทม์ (เช็คความสว่างของกระดาษและความคมชัดของตัวอักษร)
    function startRealtimeDocumentDetection() {
        const analyzeCanvas = document.createElement("canvas");
        const analyzeCtx = analyzeCanvas.getContext("2d");
        analyzeCanvas.width = 160;
        analyzeCanvas.height = 120;

        scanInterval = setInterval(() => {
            if (!cameraVideo.videoWidth) return;
            analyzeCtx.drawImage(cameraVideo, 0, 0, analyzeCanvas.width, analyzeCanvas.height);
            const imgData = analyzeCtx.getImageData(20, 15, 120, 90).data;

            let brightPixels = 0;
            let darkPixels = 0;
            let totalPixels = imgData.length / 4;

            for (let i = 0; i < imgData.length; i += 4) {
                const brightness = (imgData[i] * 0.299) + (imgData[i + 1] * 0.587) + (imgData[i + 2] * 0.114);
                if (brightness > 155) brightPixels++; // พื้นกระดาษสีขาว/สว่าง
                if (brightness < 95) darkPixels++;    // ตัวอักษร/เส้นตารางบนเอกสาร
            }

            const brightRatio = brightPixels / totalPixels;
            const darkRatio = darkPixels / totalPixels;

            // เงื่อนไข: มีพื้นกระดาษสว่างเกิน 45% และมีรายละเอียดตัวอักษร/เส้นขอบ
            if (brightRatio > 0.45 && darkRatio > 0.015) {
                scannerFrame.classList.add("detected");
                scannerStatusText.innerHTML = `<i class="fas fa-check-circle" style="color:#2ecc71;"></i> AI ตรวจพบเอกสารชัดเจน พร้อมถ่ายภาพ`;
            } else {
                scannerFrame.classList.remove("detected");
                scannerStatusText.innerHTML = `<i class="fas fa-robot"></i> เล็งให้เห็นกระดาษเอกสารชัดเจนในกรอบ...`;
            }
        }, 400);
    }

    // เมื่อกดปุ่มถ่ายภาพในกล้อง
    captureBtn.addEventListener("click", () => {
        if (!cameraVideo.videoWidth) return;

        const capCanvas = document.createElement("canvas");
        capCanvas.width = cameraVideo.videoWidth;
        capCanvas.height = cameraVideo.videoHeight;
        const ctx = capCanvas.getContext("2d");
        ctx.drawImage(cameraVideo, 0, 0, capCanvas.width, capCanvas.height);

        const dataUrl = capCanvas.toDataURL("image/jpeg", 0.85);
        stopCamera();
        processAndVerifyDocumentImage(dataUrl);
    });

    // ฟังก์ชันย่อรูปและใช้ AI (Tesseract OCR) ตรวจสอบว่าเป็นเอกสารจริงหรือไม่
    function processAndVerifyDocumentImage(rawDataUrl) {
        const img = new Image();
        img.onload = async function() {
            const maxWidth = 1200;
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = width;
            tempCanvas.height = height;
            const ctx = tempCanvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            attachedDocumentBase64 = tempCanvas.toDataURL("image/jpeg", 0.8);
            docPreview.src = attachedDocumentBase64;
            docPreview.style.display = "block";
            documentUploadSection.style.borderColor = "var(--border-color)";

            // เริ่มสแกนตรวจสอบเอกสารด้วย AI (Tesseract.js)
            aiDocBadge.className = "ai-doc-badge scanning";
            aiDocBadge.innerHTML = `<i class="fas fa-spinner fa-spin"></i> AI กำลังตรวจสอบข้อความบนเอกสารประกอบ...`;

            try {
                const result = await Tesseract.recognize(attachedDocumentBase64, 'tha+eng');
                const detectedText = (result.data.text || "").trim();
                const keywords = ["ใบรับรอง", "แพทย์", "โรงพยาบาล", "คลินิก", "ป่วย", "รักษา", "ความเห็น", "วันที่", "medical", "certificate", "hospital", "clinic", "ลากิจ", "เอกสาร"];
                
                const foundKeyword = keywords.some(kw => detectedText.toLowerCase().includes(kw));

                if (foundKeyword) {
                    aiDocBadge.className = "ai-doc-badge valid";
                    aiDocBadge.innerHTML = `<i class="fas fa-check-circle"></i> AI ตรวจสอบแล้ว: พบข้อมูลเอกสาร/ใบรับรองแพทย์ถูกต้อง`;
                } else if (detectedText.length >= 20) {
                    aiDocBadge.className = "ai-doc-badge valid";
                    aiDocBadge.innerHTML = `<i class="fas fa-check-circle"></i> AI ตรวจสอบแล้ว: พบรูปแบบเอกสารที่มีข้อความชัดเจน`;
                } else {
                    aiDocBadge.className = "ai-doc-badge warning";
                    aiDocBadge.innerHTML = `<i class="fas fa-exclamation-triangle"></i> AI แจ้งเตือน: ไม่พบข้อความที่ชัดเจนบนภาพ กรุณาตรวจสอบว่าภาพไม่เบลอ`;
                }
            } catch (err) {
                console.warn("AI OCR Warning:", err);
                aiDocBadge.className = "ai-doc-badge valid";
                aiDocBadge.innerHTML = `<i class="fas fa-check-circle"></i> แนบรูปภาพเอกสารเรียบร้อยแล้ว`;
            }
        };
        img.src = rawDataUrl;
    }

    // =========================================================================
    // ตัวแปร input ระยะเวลาลา
    // =========================================================================
    const startDate = document.getElementById("startDate");
    const startTime = document.getElementById("startTime");
    const endDate = document.getElementById("endDate");
    const endTime = document.getElementById("endTime");
    const leaveDisplay = document.getElementById("leaveDaysDisplay");

    function calculateLeaveMinutes(sDate, sTime, eDate, eTime) {
        if (!sDate || !sTime || !eDate || !eTime) return 0;
        const start = new Date(`${sDate}T${sTime}`);
        const end = new Date(`${eDate}T${eTime}`);
        if (end <= start) return 0;

        let totalMinutes = 0;
        let current = new Date(start);
        current.setHours(0, 0, 0, 0);

        while (current <= end) {
            const dayOfWeek = current.getDay();

            if (dayOfWeek === 6) {
                const morningStart = new Date(current); morningStart.setHours(8,0,0,0);
                const morningEnd = new Date(current); morningEnd.setHours(12,0,0,0);
                const afternoonStart = new Date(current); afternoonStart.setHours(13,0,0,0);
                const afternoonEnd = new Date(current); afternoonEnd.setHours(16,0,0,0);

                let overlapMorning = Math.max(0, Math.min(end, morningEnd) - Math.max(start, morningStart))/60000;
                let overlapAfternoon = Math.max(0, Math.min(end, afternoonEnd) - Math.max(start, afternoonStart))/60000;
                let minutes = overlapMorning + overlapAfternoon;
                if (minutes >= 420) minutes = 480;
                totalMinutes += minutes;

            } else if (dayOfWeek !== 0) {
                const morningStart = new Date(current); morningStart.setHours(8,0,0,0);
                const morningEnd = new Date(current); morningEnd.setHours(12,0,0,0);
                const afternoonStart = new Date(current); afternoonStart.setHours(13,0,0,0);
                const afternoonEnd = new Date(current); afternoonEnd.setHours(17,0,0,0);

                let overlapMorning = Math.max(0, Math.min(end, morningEnd) - Math.max(start, morningStart))/60000;
                let overlapAfternoon = Math.max(0, Math.min(end, afternoonEnd) - Math.max(start, afternoonStart))/60000;
                totalMinutes += overlapMorning + overlapAfternoon;
            }

            current.setDate(current.getDate() + 1);
            current.setHours(0,0,0,0);
        }

        return Math.round(totalMinutes);
    }

    function updateLeaveDisplay() {
        const leaveMinutes = calculateLeaveMinutes(startDate.value, startTime.value, endDate.value, endTime.value);
        leaveDisplay.innerText = `รวมเวลา: ${formatMinutes(leaveMinutes)}`;
    }

    startDate.addEventListener("change", updateLeaveDisplay);
    startTime.addEventListener("change", updateLeaveDisplay);
    endDate.addEventListener("change", updateLeaveDisplay);
    endTime.addEventListener("change", updateLeaveDisplay);
    updateLeaveDisplay();
    
    // ฟังก์ชันลายเซ็น
    const canvas = document.getElementById('signaturePad');
    const signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgba(0,0,0,0)',
        penColor: 'black',
        minWidth: 0.5,
        maxWidth: 2.5,
        velocityFilterWeight: 0.7
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
        signaturePad.clear();
    });
    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Submit
    document.getElementById("submitBtn").addEventListener("click", () => {
        const fields = [
            document.getElementById("empName"),
            document.getElementById("empId"),
            document.getElementById("position"),
            document.getElementById("department"),
            document.getElementById("leaveType"),
            document.getElementById("reason"),
            document.getElementById("startDate"),
            document.getElementById("startTime"),
            document.getElementById("endDate"),
            document.getElementById("endTime")
        ];
        let hasEmpty = false;
        fields.forEach(f => f.style.borderColor = 'var(--border-color)');
        fields.forEach(f => { if(!f.value.trim()){ f.style.borderColor='red'; hasEmpty=true; }});

        const selectedDocRadio = Array.from(docRadios).find(r => r.checked);
        if (!selectedDocRadio) {
            alert("กรุณาเลือกว่ามีเอกสารประกอบหรือไม่");
            return;
        }

        // ตรวจสอบว่าถ้าเลือก "มี" เอกสารประกอบ ต้องแนบไฟล์หรือถ่ายรูปด้วย
        if (selectedDocRadio.value === "มี" && !attachedDocumentBase64) {
            documentUploadSection.style.borderColor = "red";
            alert("คุณเลือก 'มีเอกสารประกอบ' กรุณาเลือกรูปหรือถ่ายภาพเอกสารประกอบก่อนส่งคำขอครับ");
            return;
        }

        if(hasEmpty){ alert("กรุณากรอกข้อมูลให้ครบทุกช่อง (กรอบสีแดงคือช่องที่ว่าง)"); return; }
        if(signaturePad.isEmpty()){ alert("กรุณาเซ็นชื่อก่อนส่ง"); return; }

        const leaveMinutes = calculateLeaveMinutes(startDate.value, startTime.value, endDate.value, endTime.value);

        if (leaveMinutes === 0) {
            alert("เวลาไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง เช่น ลาตั้งแต่ วันที่ dd/mm/yy 08:00 ถึงวันที่ dd/mm/yy 17:00");
            return;
        }

        if (leaveMinutes > 480) {
            alert("ไม่อนุญาตให้ลาเกิน 1 วันต่อครั้ง หากต้องการลาหลายวัน กรุณากรอกแบบฟอร์มแยกทีละวันครับ");
            return;
        }

        const leaveType = leaveTypeEl.value;
        let maxMinutes = 0;
        switch(leaveType){
            case "AL": maxMinutes=set1[3]; break;
            case "SL": maxMinutes=set1[4]; break;
            case "BL": maxMinutes=set1[5]; break;
        }
        if(leaveMinutes > maxMinutes){
            alert(`จำนวนเวลาที่ขอ (${formatMinutes(leaveMinutes)}) เกินสิทธิ์คงเหลือ (${formatMinutes(maxMinutes)})`);
            return;
        }

        const leaveData = {
            empId: document.getElementById("empId").value,
            empName: document.getElementById("empName").value,
            position: document.getElementById("position").value,
            department: document.getElementById("department").value,
            leaveType: leaveType,
            reason: document.getElementById("reason").value,
            hasDocument: selectedDocRadio.value,
            documentData: selectedDocRadio.value === "มี" ? attachedDocumentBase64 : "",
            startDate: startDate.value,
            startTime: startTime.value,
            endDate: endDate.value,
            endTime: endTime.value,
            leaveMinutes: leaveMinutes,
            signatureData: signaturePad.toDataURL()
        };
        localStorage.setItem("leavePreviewData", JSON.stringify(leaveData));
        window.location.href = "preview.html";
    });
});
    </script>
</body>
</html>
